<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsisphere V2 Demo</title><style>html,body{margin:0;height:100%;background:#10131b;color:#e7eaf2;font:14px Inter,system-ui,sans-serif}body{display:grid;place-items:center}.load{display:flex;gap:12px;align-items:center;padding:18px 22px;border:1px solid #363d50;border-radius:12px;background:#171b25}.spin{width:18px;height:18px;border:2px solid #383f54;border-top-color:#645cff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><span class="spin"></span><span>Loading the actual Obsisphere V2 panel…</span></div><script>
(async()=>{const page=new URLSearchParams(location.search).get('demoPage')||location.hash.slice(1)||'dashboard';if(!('serviceWorker'in navigator)){document.querySelector('.load span:last-child').textContent='Service workers are required for the interactive demo.';return}try{const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});await navigator.serviceWorker.ready;if(!reg.active){await new Promise(r=>setTimeout(r,250))}location.replace('runtime/index.html#'+encodeURIComponent(page))}catch(e){console.error(e);document.querySelector('.load span:last-child').textContent='Demo failed to initialize. Refresh to retry.'}})();
</script></body></html>
